[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-decision-harness"
version = "0.4.0"
description = "Configurable qualification-gated decision harness"
requires-python = ">=3.11"
authors = [{name = "Garros Gong"}]
dependencies = []

[project.scripts]
adh = "agent_decision_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
